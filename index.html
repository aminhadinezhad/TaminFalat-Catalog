    <style>
      @font-face {
        font-family: "Kalameh";
        src: url("assets/fonts/KalamehWeb(FaNum)-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {

        src: url("assets/fonts/KalamehWeb(FaNum)-Medium.woff2") format("woff2");

        font-display: swap;
      }
      @font-face {

        src: url("assets/fonts/KalamehWeb(FaNum)-SemiBold.woff2")

        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Kalameh";
        src: url("assets/fonts/KalamehWeb(FaNum)-Bold.woff2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }
      @font-face {

        src: url("assets/fonts/KalamehWeb(FaNum)-ExtraBold.woff2")

        font-weight: 800;
        font-display: swap;
      }

      :root {
        --bs-body-font-family: Kalameh, "Segoe UI", Tahoma, sans-serif;
        --bs-body-line-height: 2;
        --bs-body-color: #1c1c1c;
        --tf-blue: #164194;
        --tf-orange: #f18815;
        --tf-line: #c6c6c6;
        --tf-banner-h: 80px;
      }
      body {
        background: #fff;
        padding-top: calc(var(--tf-banner-h) + 1rem);
      }

      .page {
        max-width: 512px;
        margin-inline: auto;
      }

      .tf-sticky-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1020;
        background: #f18815;
      }
      .tf-sticky-banner img {
        display: block;
        height: var(--tf-banner-h);
        max-width: 100%;
        object-fit: contain;
        margin-inline: auto;
      }

      .tf-title {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        color: var(--tf-blue);
        font-weight: 800;
        font-size: clamp(1.35rem, 5vw, 1.9rem);
      }
      .tf-title::before,
      .tf-title::after {
        content: "";
        flex: 1;
        height: 3px;
        background: var(--tf-blue);
      }

      .tf-cats img {
        width: 100%;
        max-width: 188px;
        aspect-ratio: 188 / 227;
        object-fit: contain;
      }

      .tf-clients {
        scroll-snap-type: x mandatory;
      }
      .tf-clients > * {
        flex: 0 0 170px;
        height: 170px;
        scroll-snap-align: start;
        border: 3px solid color-mix(in srgb, var(--tf-blue) 50%, transparent);
        border-radius: 1.75rem;
      }
      .tf-clients img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .tf-clients::-webkit-scrollbar {
        height: 6px;
      }
      .tf-clients::-webkit-scrollbar-thumb {
        background: var(--tf-line);
        border-radius: 99px;
      }

      .tf-social img {
        width: 100%;
        max-width: 90px;
        transition:
          transform 0.18s ease,
          filter 0.18s ease;
      }
      /* .tf-social a:hover img,
      .tf-social a:focus-visible img {
        transform: translateY(-4px);
        filter: drop-shadow(0 0.5rem 1rem rgba(27, 63, 158, 0.22));
      } */

      a {
        text-decoration: none;
        color: inherit;
      }
      a:focus-visible {
        outline: 3px solid var(--tf-orange);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        var track = document.querySelector(".tf-clients");
        if (!track || track.children.length < 2) return;

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
        var dir = getComputedStyle(track).direction === "rtl" ? -1 : 1;
        var timer = null;

        function step() {
          var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
          var amount =
            track.firstElementChild.getBoundingClientRect().width + gap;
          var atEnd =
            Math.abs(track.scrollLeft) + track.clientWidth >=
            track.scrollWidth - 1;

          track.scrollTo({
            left: atEnd ? 0 : track.scrollLeft + amount * dir,
            behavior: "smooth",
          });
        }

        function play() {
          if (timer || reduce.matches) return;
          timer = setInterval(step, 2000);
        }
        function pause() {
          clearInterval(timer);
          timer = null;
        }

        track.addEventListener("pointerenter", pause);
        track.addEventListener("pointerleave", play);
        track.addEventListener("focusin", pause);
        track.addEventListener("focusout", play);
        document.addEventListener("visibilitychange", function () {
          document.hidden ? pause() : play();
        });
        reduce.addEventListener("change", function () {
          reduce.matches ? pause() : play();
        });

        play();
      })();
    </script>
