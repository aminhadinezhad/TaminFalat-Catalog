    <script>
      (function () {
        var track = document.querySelector(".tf-clients");
        if (!track || track.children.length < 2) return;

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
        var canHover = window.matchMedia("(hover: hover)");
        var dir = getComputedStyle(track).direction === "rtl" ? -1 : 1;
        var STEP_MS = 2000;
        var RESUME_MS = 3000;
        var timer = null;
        var resumeTimer = null;

        function step() {
          var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
          var amount =
            track.firstElementChild.getBoundingClientRect().width + gap;
          var atEnd =
            Math.abs(track.scrollLeft) + track.clientWidth >=
            track.scrollWidth - 1;

          track.scrollTo({
            left: atEnd ? 0 : track.scrollLeft + amount * dir,
            behavior: "smooth",
          });
        }

        function play() {
          if (timer || reduce.matches) return;
          timer = setInterval(step, STEP_MS);
        }
        function pause() {
          clearInterval(timer);
          timer = null;
          clearTimeout(resumeTimer);
          resumeTimer = null;
        }

        // هر دست زدن کاربر فقط موقتاً متوقف می کند و خودش دوباره راه می افتد
        function nudge() {
          pause();
          resumeTimer = setTimeout(play, RESUME_MS);
        }

        [
          "pointerdown",
          "pointerup",
          "touchstart",
          "touchend",
          "wheel",
          "keydown",
        ].forEach(function (ev) {
          track.addEventListener(ev, nudge, { passive: true });
        });

        if (canHover.matches) {
          track.addEventListener("mouseenter", pause);
          track.addEventListener("mouseleave", play);
        }

        document.addEventListener("visibilitychange", function () {
          document.hidden ? pause() : play();
        });
        reduce.addEventListener("change", function () {
          reduce.matches ? pause() : play();
        });

        play();
      })();
    </script>
